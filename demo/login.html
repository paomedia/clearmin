<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('cm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
    <link rel="stylesheet" href="../dist/css/clearmin.min.css">
    <link rel="stylesheet" href="../dist/css/roboto.css">
    <link rel="stylesheet" href="../dist/fontawesome/css/all.min.css">
    <title>Clearmin login</title>
  </head>
  <body class="cm-login">
    <div class="text-center bg-body border-bottom" style="padding:90px 0 30px">
      <img src="../dist/img/logo-big.svg" width="300" height="45" alt="Clearmin">
    </div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 col-xl-3" style="margin:40px 0">
          <form method="post" action="index.html" class="row g-3">
            <div class="col-12">
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-fw fa-user" aria-hidden="true"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Username" aria-label="Username">
              </div>
            </div>
            <div class="col-12">
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-fw fa-lock" aria-hidden="true"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Password" aria-label="Password">
              </div>
            </div>
            <div class="col-6 d-flex align-items-center">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
            </div>
            <div class="col-6">
              <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
